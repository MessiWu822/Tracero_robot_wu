# Merged with the installed TurtleBot3 Burger parameter file at runtime.
amcl:
  ros__parameters:
    use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true

map_saver:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 0.5
    FollowPath:
      min_vel_theta: 0.0
      max_vel_theta: 0.01
      min_speed_theta: 0.0
      vtheta_samples: 3

# The installed TurtleBot3 params use post-Humble "::" plugin names, while
# this source-built Humble Nav2 exports these pluginlib IDs with "/".
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_nav_to_pose_bt_xml: "__TC01_BT_XML__"

waypoint_follower:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true

collision_monitor:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        enabled: false
      voxel_layer:
        enabled: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        enabled: false
      voxel_layer:
        enabled: false

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
